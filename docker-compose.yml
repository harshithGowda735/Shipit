services:
  backend:
    build: ./backend
    container_name: shipit-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://shipit_user:shipit_dev_password@postgres:5432/shipit"
      REDIS_URL: "redis://redis:6379/0"

  postgres:
    image: postgres:16
    container_name: shipit-postgres
    environment:
      POSTGRES_USER: shipit_user
      POSTGRES_PASSWORD: shipit_dev_password
      POSTGRES_DB: shipit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shipit-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: